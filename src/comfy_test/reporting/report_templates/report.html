<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$repo_name - Test Results</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e6edf3;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            background: #162033;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid #243656;
        }

        body.in-iframe header {
            display: none;
        }

        body.in-iframe .container {
            padding-top: 1.25rem;
        }

        body.in-iframe .summary-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        h1 a {
            color: #e6edf3;
            text-decoration: none;
        }

        h1 a:hover { color: #58a6ff; }

        .meta-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.6rem;
            background: #1c2d44;
            border: 1px solid #243656;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: #8ba3c1;
        }

        a.meta-chip {
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        a.meta-chip:hover {
            background: #25395a;
            border-color: #3a5587;
            color: #cfe1f7;
        }

        .meta-chip svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Summary Section */
        .summary {
            background: #162033;
            border: 1px solid #243656;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .progress-bar {
            background: #1c2d44;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
            flex: 1;
        }

        .progress-fill {
            background: #3fb950;
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .progress-fill.has-failures {
            background: linear-gradient(90deg, #3fb950 0%, #3fb950 $pass_rate%, #f85149 $pass_rate%, #f85149 100%);
            width: 100% !important;
            border-radius: 6px;
        }

        .progress-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8ba3c1;
            white-space: nowrap;
            min-width: 3.5rem;
            text-align: right;
        }

        .stats {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .stat-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .stat-pass {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
        }

        .stat-fail {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
        }

        .stat-total {
            color: #8ba3c1;
            font-size: 0.85rem;
        }

        /* Failed Section */
        .failed-section {
            background: rgba(248, 81, 73, 0.08);
            border: 1px solid rgba(248, 81, 73, 0.3);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 2rem;
        }

        .failed-section h2 {
            color: #f85149;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .failed-item {
            background: #162033;
            border: 1px solid #243656;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }

        .failed-item:last-child {
            margin-bottom: 0;
        }

        .failed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .failed-name {
            font-weight: 600;
            color: #f85149;
        }

        .failed-duration {
            color: #8ba3c1;
            font-size: 0.8rem;
        }

        .failed-error {
            background: #0f1923;
            border: 1px solid #243656;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'SFMono-Regular', 'Menlo', 'Monaco', monospace;
            font-size: 0.8rem;
            color: #d29922;
            margin-bottom: 0.5rem;
        }

        .log-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .log-link:hover {
            text-decoration: underline;
        }

        /* Workflow Grid */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: #8ba3c1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .view-controls {
            display: flex;
            gap: 0;
            align-items: center;
            border: 1px solid #243656;
            border-radius: 6px;
            overflow: hidden;
        }

        .view-btn {
            background: #1c2d44;
            color: #8ba3c1;
            border: none;
            border-right: 1px solid #243656;
            padding: 0.3rem 0.75rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .view-btn:last-child {
            border-right: none;
        }

        .view-btn:hover {
            background: #243656;
            color: #e6edf3;
        }

        .view-btn.active {
            background: #58a6ff;
            color: #fff;
        }

        .workflow-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .workflow-grid.view-list {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .workflow-grid.view-list .workflow-card {
            border-radius: 0;
            border-bottom: 1px solid #243656;
        }

        .workflow-grid.view-list .workflow-card:first-child {
            border-radius: 8px 8px 0 0;
        }

        .workflow-grid.view-list .workflow-card:last-child {
            border-radius: 0 0 8px 8px;
            border-bottom: none;
        }

        .workflow-grid.view-list .workflow-card:only-child {
            border-radius: 8px;
        }

        .workflow-grid.view-list .workflow-screenshot {
            width: 100%;
            height: auto;
            aspect-ratio: auto;
        }

        .workflow-grid.view-list .workflow-info {
            border-top: 1px solid #243656;
            padding: 0.75rem 1rem;
        }

        .workflow-grid.view-list .workflow-name {
            max-width: none;
            font-size: 0.9rem;
        }

        .workflow-card {
            background: #162033;
            border: 1px solid #243656;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
        }

        .workflow-card:hover {
            transform: translateY(-1px);
            border-color: #4a6282;
        }

        .workflow-card.clickable {
            cursor: pointer;
        }

        .workflow-card.failed {
            border-color: #f85149;
        }

        .workflow-card.failed:hover {
            border-color: #f85149;
        }

        .workflow-screenshot {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            background: #0f1923;
            display: block;
        }

        .workflow-screenshot.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a6282;
            font-size: 0.8rem;
        }

        .workflow-info {
            padding: 0.75rem 1rem;
            border-top: 1px solid #243656;
        }

        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .workflow-name {
            font-weight: 500;
            font-size: 0.85rem;
            color: #e6edf3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .workflow-badge {
            padding: 0.15rem 0.5rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .workflow-badge.pass {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
        }

        .workflow-badge.fail {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
        }

        .workflow-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #4a6282;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 4, 9, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            overflow-y: auto;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: auto;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #243656;
            align-self: center;
            cursor: zoom-in;
        }

        .img-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1002;
            background: rgba(1, 4, 9, 0.95);
            overflow: auto;
            align-items: center;
            justify-content: center;
        }

        .img-overlay.active {
            display: flex;
        }

        .img-overlay.zoomed {
            align-items: flex-start;
            justify-content: flex-start;
        }

        .img-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: zoom-in;
        }

        .img-overlay.zoomed img {
            max-width: none;
            max-height: none;
            cursor: zoom-out;
        }

        .lightbox-close {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #e6edf3;
            cursor: pointer;
            opacity: 0.6;
            background: none;
            border: none;
            z-index: 1001;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-fullscreen {
            position: fixed;
            top: 1.1rem;
            right: 4.5rem;
            font-size: 1.4rem;
            color: #e6edf3;
            cursor: pointer;
            opacity: 0.6;
            background: none;
            border: none;
            z-index: 1001;
            line-height: 1;
        }

        .lightbox-fullscreen:hover {
            opacity: 1;
        }

        .lightbox-fullscreen.active {
            opacity: 1;
            color: #58a6ff;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(22, 32, 51, 0.8);
            border: 1px solid #243656;
            color: #e6edf3;
            font-size: 2.5rem;
            width: 48px;
            height: 64px;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.6;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
            padding: 0;
            line-height: 1;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-nav-left { left: 1rem; }
        .lightbox-nav-right { right: 1rem; }

        .lightbox-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: #162033;
            border: 1px solid #243656;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .lightbox-title {
            font-size: 1rem;
            font-weight: 600;
            color: #e6edf3;
        }

        .lightbox-hardware {
            display: block;
            font-size: 0.75rem;
            color: #8ba3c1;
            margin-top: 0.25rem;
        }

        .lightbox-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .lightbox-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .lightbox-badge.pass {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
        }

        .lightbox-badge.fail {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
        }

        .lightbox-duration {
            color: #8ba3c1;
            font-size: 0.85rem;
        }

        .lightbox-log {
            background: #0f1923;
            border: 1px solid #243656;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'SFMono-Regular', 'Menlo', 'Monaco', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            color: #8ba3c1;
        }

        .lightbox-log::-webkit-scrollbar {
            width: 8px;
        }

        .lightbox-log::-webkit-scrollbar-track {
            background: #162033;
            border-radius: 4px;
        }

        .lightbox-log::-webkit-scrollbar-thumb {
            background: #243656;
            border-radius: 4px;
        }

        .lightbox-log::-webkit-scrollbar-thumb:hover {
            background: #4a6282;
        }

        /* Resource Graph */
        .resource-graph {
            display: none;
            margin-top: 1rem;
            background: #162033;
            border: 1px solid #243656;
            border-radius: 8px;
            padding: 1rem;
        }

        .resource-graph.active {
            display: block;
        }

        .resource-graph-title {
            font-size: 0.8rem;
            color: #8ba3c1;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .resource-graph canvas {
            width: 100%;
            height: 120px;
            cursor: crosshair;
        }

        .resource-legend {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #8ba3c1;
        }

        .resource-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .resource-legend .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .resource-legend .ram { background: #3fb950; }
        .resource-legend .gpu { background: #d29922; }


        .noUi-value {
            display: none;
        }

        /* Models Section */
        .models-section {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .models-total {
            font-size: 0.8rem;
            color: #8ba3c1;
        }

        .models-folder {
            background: #162033;
            border: 1px solid #243656;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        .models-folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            user-select: none;
            list-style: none;
        }

        .models-folder-header::-webkit-details-marker {
            display: none;
        }

        .models-folder-header::before {
            content: '\25B6';
            font-size: 0.6rem;
            color: #4a6282;
            margin-right: 0.5rem;
            transition: transform 0.15s;
        }

        .models-folder[open] > .models-folder-header::before {
            transform: rotate(90deg);
        }

        .models-folder-name {
            font-family: 'SFMono-Regular', 'Menlo', 'Monaco', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: #58a6ff;
        }

        .models-folder-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .models-folder-size {
            font-size: 0.8rem;
            font-weight: 600;
            color: #8ba3c1;
        }

        .models-source-link {
            font-size: 0.75rem;
            color: #3fb950;
            text-decoration: none;
            padding: 0.15rem 0.5rem;
            background: rgba(63, 185, 80, 0.1);
            border: 1px solid rgba(63, 185, 80, 0.2);
            border-radius: 2rem;
        }

        .models-source-link:hover {
            background: rgba(63, 185, 80, 0.2);
            text-decoration: none;
        }

        .models-file-list {
            border-top: 1px solid #243656;
            padding: 0.25rem 0;
        }

        .models-file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.35rem 1rem 0.35rem 2rem;
            font-size: 0.8rem;
        }

        .models-file:hover {
            background: rgba(88, 166, 255, 0.05);
        }

        .models-file-path {
            font-family: 'SFMono-Regular', 'Menlo', 'Monaco', monospace;
            color: #8ba3c1;
            word-break: break-all;
        }

        .models-file-size {
            color: #4a6282;
            white-space: nowrap;
            margin-left: 1rem;
            flex-shrink: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: #4a6282;
            font-size: 0.8rem;
        }

        footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .workflow-grid {
                grid-template-columns: 1fr !important;
            }

            .workflow-grid.view-list .workflow-card {
                grid-template-columns: 1fr;
            }

            .workflow-grid.view-list .workflow-screenshot {
                width: 100%;
                height: auto;
                aspect-ratio: 16/10;
            }

            .stats {
                flex-direction: column;
                align-items: flex-start;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .container {
                padding: 1rem;
            }
        }

        /* --- install replay ------------------------------------------------ */
        .install-replay { margin: 24px 0; border: 1px solid var(--border, #2a2a2a);
                          border-radius: 6px; overflow: hidden; }
        .install-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                        background: rgba(255,255,255,0.03); }
        .install-play { width: 30px; height: 30px; flex: 0 0 auto; cursor: pointer;
                        border: 1px solid var(--border, #2a2a2a); border-radius: 4px;
                        background: transparent; color: inherit; font-size: 12px; }
        .install-scrub { flex: 1 1 auto; }
        .install-clock { font-family: ui-monospace, monospace; font-size: 12px; opacity: .75;
                         min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
        .install-speed { background: transparent; color: inherit; font-size: 12px;
                         border: 1px solid var(--border, #2a2a2a); border-radius: 4px; padding: 2px 4px; }
        .install-chapters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
        .install-chapters button { font-size: 11px; padding: 2px 8px; cursor: pointer;
                                   border: 1px solid var(--border, #2a2a2a); border-radius: 10px;
                                   background: transparent; color: inherit; opacity: .8; }
        .install-chapters button:hover { opacity: 1; }
        .install-log { margin: 0; padding: 12px; max-height: 380px; overflow-y: auto;
                       font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                       font-size: 12px; line-height: 1.5; white-space: pre-wrap;
                       word-break: break-word; }
        .install-log .ch { opacity: .95; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <h1><a href="https://github.com/PozzettiAndrea/$repo_name">$repo_name</a> Test Results</h1>
        <div class="meta-chips">
            $meta_chips
        </div>
    </header>

    <div class="container">
        <div class="summary">
            <div class="progress-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill$progress_class" style="width: $pass_rate%"></div>
                </div>
                <span class="progress-label">$pass_rate_display%</span>
            </div>
            <div class="stats">
                <span class="stat-badge stat-pass">$passed passed</span>
                $failed_badge
                <span class="stat-total">$passed/$total tests</span>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title">Workflows</h2>
            <div class="view-controls">
                <button class="view-btn active" onclick="setView('grid')">Grid</button>
                <button class="view-btn" onclick="setView('list')">List</button>
            </div>
        </div>
        <div class="workflow-grid" id="workflow-grid">
            $workflow_cards
        </div>

        $failed_section

        $install_section

        $models_section
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-fullscreen" id="lightbox-fullscreen-btn" onclick="toggleTrueFullscreen()" title="Fullscreen (F) -- arrow keys walk workflows/lanes">&#x26F6;</button>
        <button class="lightbox-nav lightbox-nav-left" onclick="navigateLightbox(-1)">&#8249;</button>
        <button class="lightbox-nav lightbox-nav-right" onclick="navigateLightbox(1)">&#8250;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
            <video id="lightbox-video" controls preload="metadata" style="display:none; max-width:90vw; max-height:80vh; background:#000;"></video>
            <div class="resource-graph" id="resource-graph">
                <div class="resource-graph-title">Resource Usage</div>
                <canvas id="resource-canvas"></canvas>
                <div class="resource-legend">
                    <span><span class="dot ram"></span> RAM (GB)</span>
                    <span id="gpu-legend" style="display:none"><span class="dot gpu"></span> VRAM (GB)</span>
                </div>
            </div>
            <div class="lightbox-info">
                <div>
                    <span class="lightbox-title" id="lightbox-title"></span>
                    <span class="lightbox-hardware" id="lightbox-hardware"></span>
                </div>
                <div class="lightbox-meta">
                    <span class="lightbox-badge" id="lightbox-badge"></span>
                    <span class="lightbox-duration" id="lightbox-duration"></span>
                </div>
            </div>
            <pre class="lightbox-log" id="lightbox-log"></pre>
        </div>
    </div>

    <div class="img-overlay" id="img-overlay">
        <img id="img-overlay-content" src="" alt="">
    </div>

    <footer>
        Generated by <a href="https://github.com/PozzettiAndrea/comfy-test">comfy-test</a>
    </footer>

    <script>
        function setView(mode) {
            const grid = document.getElementById('workflow-grid');
            grid.className = mode === 'list' ? 'workflow-grid view-list' : 'workflow-grid';
            document.querySelectorAll('.view-controls .view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === mode);
            });
        }

        const workflowData = $workflow_data_js;
        const workflowNames = Object.keys(workflowData);
        const videoData = $video_data_js;

        const inIframe = window !== window.top;
        let currentWorkflow = null;
        let originalLogContent = '';

        function openLightboxByName(name) {
            const w = workflowData[name];
            if (w) openLightbox(w.src, w.title, w.status, w.duration, w.log, w.hardware);
        }

        function openLightbox(src, title, status, duration, logContent, hardware) {
            const overlay = document.getElementById('img-overlay');
            const wasFullscreen = overlay.classList.contains('active');
            const wasZoomed = overlay.classList.contains('zoomed');

            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-title').textContent = title;
            currentWorkflow = title;
            originalLogContent = logContent;

            const badge = document.getElementById('lightbox-badge');
            badge.textContent = status;
            badge.className = 'lightbox-badge ' + status;

            document.getElementById('lightbox-duration').textContent = duration + 's';
            document.getElementById('lightbox-log').textContent = logContent || '(No log available)';

            const hwEl = document.getElementById('lightbox-hardware');
            if (hardware) {
                const parts = [];
                if (hardware.os) parts.push(hardware.os);
                if (hardware.cpu) parts.push(hardware.cpu);
                if (hardware.gpu) parts.push(hardware.gpu);
                hwEl.textContent = parts.join(' | ');
            } else {
                hwEl.textContent = status === 'skipped' ? '(Did not run on this machine)' : '';
            }

            const data = videoData[title];
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxVideo = document.getElementById('lightbox-video');

            // Reset, then show the mp4 if present, else the static screenshot.
            lightboxVideo.style.display = 'none';
            lightboxVideo.removeAttribute('src');
            lightboxImg.style.display = '';

            if (data && data.mp4) {
                // Playable mp4: native <video controls> (real seek bar); hide img.
                lightboxVideo.src = 'videos/' + encodeURIComponent(title) + '/' + data.mp4;
                lightboxVideo.style.display = '';
                lightboxImg.style.display = 'none';
            }

            loadResourceGraph(title);

            // Keep the fullscreen image overlay open across workflow navigation
            // instead of dropping back to the plain lightbox; otherwise close it.
            if (wasFullscreen) {
                document.getElementById('img-overlay-content').src = src;
                overlay.classList.add('active');
                overlay.classList.toggle('zoomed', wasZoomed);
            } else {
                closeImgOverlay();
            }

            document.getElementById('lightbox').classList.add('active');
            history.replaceState(null, '', '#' + encodeURIComponent(title));

            // Notify parent frames for deep linking
            if (inIframe) {
                window.parent.postMessage({ type: 'comfytest-open', name: title }, '*');
            }
        }

        let resourceGraphState = null;

        async function loadResourceGraph(workflowName) {
            const graphContainer = document.getElementById('resource-graph');
            const canvas = document.getElementById('resource-canvas');
            const gpuLegend = document.getElementById('gpu-legend');

            resourceGraphState = null;

            try {
                const csvResponse = await fetch('logs/' + workflowName + '_resources.csv');

                if (!csvResponse.ok) {
                    graphContainer.classList.remove('active');
                    return;
                }

                const text = await csvResponse.text();
                const allLines = text.trim().split('\n');

                let totalRamGb = 32;
                if (allLines[0].startsWith('#')) {
                    const metaMatch = allLines[0].match(/total_ram_gb=([\d.]+)/);
                    if (metaMatch) {
                        totalRamGb = parseFloat(metaMatch[1]);
                    }
                }

                const dataLines = allLines.slice(2);

                if (dataLines.length < 2) {
                    graphContainer.classList.remove('active');
                    return;
                }

                const data = dataLines.map(line => {
                    const [t, ram, vram] = line.split(',');
                    return {
                        t: parseFloat(t),
                        ram: parseFloat(ram),
                        vram: vram ? parseFloat(vram) : null
                    };
                });

                const hasVram = data.some(d => d.vram !== null);
                gpuLegend.style.display = hasVram ? 'flex' : 'none';

                graphContainer.classList.add('active');
                await new Promise(r => setTimeout(r, 10));

                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const w = rect.width;
                const h = rect.height;
                const padding = { top: 10, right: 40, bottom: 20, left: 45 };
                const graphW = w - padding.left - padding.right;
                const graphH = h - padding.top - padding.bottom;

                const maxRam = Math.max(...data.map(d => d.ram), 0.5);
                const maxVram = hasVram ? Math.max(...data.filter(d => d.vram !== null).map(d => d.vram), 0.5) : 1;
                const maxTime = data[data.length - 1].t;

                resourceGraphState = { data, padding, w, h, graphW, graphH, maxRam, maxVram, maxTime, hasVram, dpr };

                drawResourceGraph();
            } catch (e) {
                console.error('Resource graph error:', e);
                graphContainer.classList.remove('active');
            }
        }

        function drawResourceGraph(hoverX) {
            if (!resourceGraphState) return;
            const { data, padding, w, h, graphW, graphH, maxRam, maxVram, maxTime, hasVram, dpr } = resourceGraphState;

            const canvas = document.getElementById('resource-canvas');
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            // Grid lines
            ctx.strokeStyle = '#1c2d44';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < 4; i++) {
                const y = padding.top + (graphH * i / 4);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(w - padding.right, y);
                ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#243656';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, h - padding.bottom);
            ctx.lineTo(w - padding.right, h - padding.bottom);
            ctx.lineTo(w - padding.right, padding.top);
            ctx.stroke();

            // Left axis: RAM
            ctx.fillStyle = '#3fb950';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'right';
            const ramMax = Math.ceil(maxRam * 10) / 10;
            ctx.fillText(ramMax.toFixed(1) + ' GB', padding.left - 3, padding.top + 4);
            ctx.fillText('0', padding.left - 3, h - padding.bottom + 4);

            // Right axis: VRAM (if present)
            if (hasVram) {
                ctx.fillStyle = '#d29922';
                ctx.textAlign = 'left';
                const vramMax = Math.ceil(maxVram * 10) / 10;
                ctx.fillText(vramMax.toFixed(1) + ' GB', w - padding.right + 3, padding.top + 4);
                ctx.fillText('0', w - padding.right + 3, h - padding.bottom + 4);
            }

            // Time labels
            ctx.fillStyle = '#4a6282';
            ctx.textAlign = 'center';
            ctx.fillText('0s', padding.left, h - padding.bottom + 12);
            ctx.fillText(maxTime.toFixed(0) + 's', w - padding.right, h - padding.bottom + 12);

            function drawLine(values, maxVal, color) {
                if (values.every(v => v === null || isNaN(v))) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                let started = false;
                data.forEach((d, i) => {
                    const val = values[i];
                    if (val === null || isNaN(val)) return;
                    const x = padding.left + (d.t / maxTime) * graphW;
                    const y = padding.top + (1 - val / maxVal) * graphH;
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else { ctx.lineTo(x, y); }
                });
                ctx.stroke();
            }

            drawLine(data.map(d => d.ram), ramMax, '#3fb950');
            if (hasVram) {
                drawLine(data.map(d => d.vram), Math.ceil(maxVram * 10) / 10, '#d29922');
            }

            // Hover crosshair
            if (hoverX !== undefined && hoverX >= padding.left && hoverX <= w - padding.right) {
                const timeAtCursor = ((hoverX - padding.left) / graphW) * maxTime;
                let closest = data[0], closestDist = Infinity;
                for (const d of data) {
                    const dist = Math.abs(d.t - timeAtCursor);
                    if (dist < closestDist) { closestDist = dist; closest = d; }
                }

                const snapX = padding.left + (closest.t / maxTime) * graphW;

                // Vertical line
                ctx.strokeStyle = 'rgba(230,237,243,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(snapX, padding.top);
                ctx.lineTo(snapX, h - padding.bottom);
                ctx.stroke();

                // Readout
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'left';
                const readoutX = snapX + 6;
                let readoutY = padding.top + 14;

                ctx.fillStyle = '#8ba3c1';
                ctx.fillText(closest.t.toFixed(1) + 's', readoutX, readoutY);
                readoutY += 13;

                ctx.fillStyle = '#3fb950';
                ctx.fillText('RAM: ' + closest.ram.toFixed(2) + ' GB', readoutX, readoutY);
                readoutY += 13;

                if (hasVram && closest.vram !== null) {
                    ctx.fillStyle = '#d29922';
                    ctx.fillText('VRAM: ' + closest.vram.toFixed(2) + ' GB', readoutX, readoutY);
                }
            }
        }

        // Canvas hover handler
        document.getElementById('resource-canvas').addEventListener('mousemove', function(e) {
            if (!resourceGraphState) return;
            const rect = this.getBoundingClientRect();
            drawResourceGraph(e.clientX - rect.left);
        });
        document.getElementById('resource-canvas').addEventListener('mouseleave', function() {
            drawResourceGraph();
        });

        function closeImgOverlay() {
            const overlay = document.getElementById('img-overlay');
            overlay.classList.remove('active', 'zoomed');
        }

        // True OS-level fullscreen (Fullscreen API -- hides browser tabs/toolbar
        // entirely), layered on top of the img-overlay so a maximized screenshot
        // is what's actually shown. Distinct from the overlay's own fit/zoom
        // click-toggle, which stays *inside* the browser chrome.
        function toggleTrueFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
                return;
            }
            const overlay = document.getElementById('img-overlay');
            const overlayImg = document.getElementById('img-overlay-content');
            overlayImg.src = document.getElementById('lightbox-img').src;
            overlay.classList.add('active');
            document.documentElement.requestFullscreen().catch((err) => {
                console.warn('[comfy-test] Fullscreen request failed:', err);
            });
        }

        document.addEventListener('fullscreenchange', function() {
            const isFullscreen = !!document.fullscreenElement;
            const btn = document.getElementById('lightbox-fullscreen-btn');
            if (btn) btn.classList.toggle('active', isFullscreen);
            // The browser exits fullscreen on its own (native Escape handling,
            // F11, etc.) without going through our own key handler -- keep the
            // image overlay in sync either way.
            if (!isFullscreen) closeImgOverlay();
        });

        function closeLightbox() {
            const lv = document.getElementById('lightbox-video');
            if (lv) lv.pause();  // stop mp4 playback on close
            if (document.fullscreenElement) document.exitFullscreen();
            closeImgOverlay();
            document.getElementById('resource-graph').classList.remove('active');
            document.getElementById('lightbox').classList.remove('active');
            history.replaceState(null, '', window.location.pathname);

            if (inIframe) {
                window.parent.postMessage({ type: 'comfytest-close' }, '*');
            }
        }

        document.getElementById('lightbox').onclick = (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        };

        function navigateLightbox(delta) {
            if (workflowNames.length === 0) return;
            const idx = workflowNames.indexOf(currentWorkflow);
            if (idx === -1) return;
            const newIdx = (idx + delta + workflowNames.length) % workflowNames.length;
            openLightboxByName(workflowNames[newIdx]);
        }

        function handleKey(key) {
            const overlay = document.getElementById('img-overlay');
            if (key === 'Escape') {
                // Check document.fullscreenElement explicitly (not the overlay's
                // 'active' class) -- the browser may have already exited native
                // fullscreen (and our fullscreenchange listener already closed
                // the overlay) by the time this handler runs, and event ordering
                // across the two isn't guaranteed. Calling exitFullscreen() again
                // when already out of fullscreen is a harmless no-op.
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else if (overlay.classList.contains('active')) {
                    closeImgOverlay();
                } else {
                    closeLightbox();
                }
                return;
            }
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (key === 'f' || key === 'F') { toggleTrueFullscreen(); return; }
                if (key === 'ArrowLeft') { navigateLightbox(-1); }
                if (key === 'ArrowRight') { navigateLightbox(1); }
                if ((key === 'ArrowUp' || key === 'ArrowDown') && inIframe) {
                    window.parent.postMessage({
                        type: 'comfytest-lane-shift',
                        delta: key === 'ArrowUp' ? -1 : 1,
                        workflow: currentWorkflow,
                        fullscreen: overlay.classList.contains('active'),
                        zoomed: overlay.classList.contains('zoomed'),
                        trueFullscreen: !!document.fullscreenElement,
                    }, '*');
                }
            }
        }

        document.onkeydown = (e) => {
            if (['Escape', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'f', 'F'].includes(e.key)) {
                e.preventDefault();
                handleKey(e.key);
            }
        };

        // Click lightbox image -> open in fullscreen overlay (fit mode)
        document.getElementById('lightbox-img').addEventListener('click', function(e) {
            e.stopPropagation();
            const overlay = document.getElementById('img-overlay');
            const overlayImg = document.getElementById('img-overlay-content');
            overlayImg.src = this.src;
            overlay.classList.add('active');
            overlay.classList.remove('zoomed');
        });

        // Click overlay image: fit -> zoomed -> close
        document.getElementById('img-overlay-content').addEventListener('click', function(e) {
            e.stopPropagation();
            const overlay = document.getElementById('img-overlay');
            if (overlay.classList.contains('zoomed')) {
                closeImgOverlay();
            } else {
                overlay.classList.add('zoomed');
            }
        });

        // Click overlay background -> close overlay
        document.getElementById('img-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeImgOverlay();
        });

        function openFromHash() {
            const hash = decodeURIComponent(window.location.hash.slice(1));
            if (hash && workflowData[hash]) {
                const w = workflowData[hash];
                openLightbox(w.src, w.title, w.status, w.duration, w.log, w.hardware);
            }
        }

        window.addEventListener('hashchange', openFromHash);
        window.addEventListener('load', openFromHash);

        // Listen for messages from parent frames
        window.addEventListener('message', function(e) {
            if (!e.data || !e.data.type) return;
            if (e.data.type === 'comfytest-open' && e.data.name) {
                openLightboxByName(e.data.name);
                if (e.data.fullscreen) {
                    // Resume directly in fullscreen after a lane hop, instead
                    // of landing on the plain lightbox.
                    const overlay = document.getElementById('img-overlay');
                    document.getElementById('img-overlay-content').src = document.getElementById('lightbox-img').src;
                    overlay.classList.add('active');
                    overlay.classList.toggle('zoomed', !!e.data.zoomed);
                    if (e.data.trueFullscreen && !document.fullscreenElement) {
                        // Best-effort: browsers require a direct user gesture for
                        // requestFullscreen(), which this postMessage relay (after
                        // an iframe navigation) may not carry -- if it's rejected,
                        // the overlay above still gives a maximized (non-native-
                        // fullscreen) view, and the user can press F/click again.
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                }
            }
            if (e.data.type === 'comfytest-key') {
                handleKey(e.data.key);
            }
        });

        // Detect iframe: hide header and move meta chips into summary
        if (inIframe) {
            document.body.classList.add('in-iframe');
            const chips = document.querySelector('.meta-chips');
            const summary = document.querySelector('.summary');
            if (chips && summary) {
                const wrapper = document.createElement('div');
                wrapper.className = 'summary-meta';
                while (chips.firstChild) wrapper.appendChild(chips.firstChild);
                summary.insertBefore(wrapper, summary.firstChild);
            }
        }
    
    // --- install replay -------------------------------------------------
    // Replays the run's own event stream. Deliberately text, not video: the
    // source IS text, so it stays selectable, greppable and kilobytes.
    // NOTE: string.Template renders this file -- literal $ must be written $$.
    (function () {
      const root = document.getElementById('install-replay');
      if (!root) return;
      const logEl = document.getElementById('install-log');
      const playBtn = document.getElementById('install-play');
      const scrub = document.getElementById('install-scrub');
      const clock = document.getElementById('install-clock');
      const speedSel = document.getElementById('install-speed');
      const chapEl = document.getElementById('install-chapters');

      let events = [], chapters = [], duration = 0, cursor = 0, timer = null;

      const fmt = (t) => {
        const m = Math.floor(t / 60), sec = Math.floor(t % 60);
        return m + ':' + String(sec).padStart(2, '0');
      };

      function renderUpTo(idx) {
        const slice = events.slice(0, idx);
        logEl.textContent = '';
        for (const e of slice) {
          const line = document.createElement('span');
          if (e.s === 'chapter') line.className = 'ch';
          line.textContent = e.m + '\n';
          logEl.appendChild(line);
        }
        logEl.scrollTop = logEl.scrollHeight;   // stick to the tail
        const t = idx > 0 ? events[idx - 1].t : 0;
        clock.textContent = fmt(t);
        if (duration > 0) scrub.value = String(Math.round((t / duration) * 1000));
      }

      function stop() {
        if (timer) { clearInterval(timer); timer = null; }
        playBtn.innerHTML = '&#9654;';
      }

      function play() {
        if (cursor >= events.length) { cursor = 0; }
        const speed = parseFloat(speedSel.value);
        if (speed === 0) { cursor = events.length; renderUpTo(cursor); return; }
        playBtn.innerHTML = '&#10073;&#10073;';
        const t0 = performance.now() - (cursor > 0 ? events[cursor - 1].t * 1000 / speed : 0);
        timer = setInterval(() => {
          const elapsed = (performance.now() - t0) / 1000 * speed;
          while (cursor < events.length && events[cursor].t <= elapsed) cursor++;
          renderUpTo(cursor);
          if (cursor >= events.length) stop();
        }, 50);
      }

      playBtn.addEventListener('click', () => { timer ? stop() : play(); });
      speedSel.addEventListener('change', () => { if (timer) { stop(); play(); } });
      scrub.addEventListener('input', () => {
        stop();
        const t = (parseInt(scrub.value, 10) / 1000) * duration;
        cursor = 0;
        while (cursor < events.length && events[cursor].t <= t) cursor++;
        renderUpTo(cursor);
      });

      fetch(root.dataset.src).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(text => {
        const lines = text.trim().split('\n');
        const head = JSON.parse(lines[0]);
        chapters = head.chapters || [];
        duration = head.duration || 0;
        events = lines.slice(1).map(l => JSON.parse(l));
        for (const c of chapters) {
          const b = document.createElement('button');
          b.textContent = c.name;
          b.addEventListener('click', () => {
            stop();
            cursor = 0;
            while (cursor < events.length && events[cursor].t <= c.t) cursor++;
            renderUpTo(cursor);
          });
          chapEl.appendChild(b);
        }
        renderUpTo(events.length);   // land on the finished log; press play to replay
      }).catch(() => {
        logEl.textContent = '(install replay unavailable)';
      });
    })();

  </script>
