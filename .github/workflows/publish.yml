name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create tags
        if: github.event_name == 'push'
        run: |
          version="${{ steps.version.outputs.version }}"
          major="${version%%.*}"

          # Create the precise semver tag (idempotent).
          # Check the REMOTE, not the local ref: actions/checkout does a shallow
          # clone with no tags, so `git rev-parse v$version` always misses and
          # the block below would then push a tag that already exists upstream.
          # That is why every commit since v0.4.14 that did not bump the version
          # failed here.
          git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1 || {
            git tag "v$version"
            git push origin "v$version"
          }

          # Move the floating major version tag forward
          git tag -f "v$major"
          git push origin "v$major" --force

      - name: Build package
        if: github.event_name == 'push'
        run: pip install build && python -m build

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
