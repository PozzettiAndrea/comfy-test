name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Nothing used to run the test suite. 15 test files, zero CI execution, and a
  # push to main tagged a release and shipped it to PyPI unverified. This job
  # gates that.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version runs default to.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"

      # Hermetic. The live-contract file skips itself without COMFY_TEST_LIVE.
      - name: Unit tests
        run: python -m pytest tests/ -q

      # Talks to download.pytorch.org, PyPI and GitHub: catches upstream
      # changing shape under us, which no stubbed test can. Kept a separate
      # step so a red here is legible as "upstream moved", not "we broke it".
      # Unreachable hosts skip rather than fail, so a blip cannot block a
      # release -- only a reachable host giving a wrong answer does.
      - name: Live upstream contract
        if: matrix.python == '3.13'
        env:
          COMFY_TEST_LIVE: '1'
        run: python -m pytest tests/test_live_contract.py -v

  check-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create tags
        if: github.event_name == 'push'
        run: |
          version="${{ steps.version.outputs.version }}"
          major="${version%%.*}"

          # Create the precise semver tag (idempotent).
          # Check the REMOTE, not the local ref: actions/checkout does a shallow
          # clone with no tags, so `git rev-parse v$version` always misses and
          # the block below would then push a tag that already exists upstream.
          # That is why every commit since v0.4.14 that did not bump the version
          # failed here.
          git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1 || {
            git tag "v$version"
            git push origin "v$version"
          }

          # Move the floating major version tag forward
          git tag -f "v$major"
          git push origin "v$major" --force

      - name: Build package
        if: github.event_name == 'push'
        run: pip install build && python -m build

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
