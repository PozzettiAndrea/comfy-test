# =============================================================================
# ComfyUI Custom Node Test Matrix
# =============================================================================
# Consumer repos call this workflow:
#   uses: PozzettiAndrea/comfy-test/.github/workflows/test-matrix.yml@main
# =============================================================================

name: ComfyUI Installation Test Matrix

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to comfy-test.toml config file"
        type: string
        default: "comfy-test.toml"
      timeout-minutes:
        description: "Job timeout in minutes"
        type: number
        default: 1440
      lane:
        description: "Run only this lane (linux-cpu, macos-cpu, windows-cpu, windows-portable-cpu, macos-desktop, windows-desktop). Empty = every lane in [test.lanes]."
        type: string
        default: ""
      platform:
        description: "DEPRECATED alias for `lane`; delete once no caller passes it."
        type: string
        default: ""
      node_repo:
        description: "DISPATCHER USE ONLY. owner/repo of the node to test (default: caller repo). A consumer repo calling this workflow directly should leave this unset. When set, comfy-test.toml + skip-check + publish target this repo instead of the caller."
        type: string
        default: ""
      node_branch:
        description: "DISPATCHER USE ONLY. branch of the node to test (default: caller ref_name)."
        type: string
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Setup: parse platform config
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    environment: test
    outputs:
      # CPU + desktop lanes (opt-in allowlist from [test.lanes] lanes=[...])
      run-linux: ${{ steps.platforms.outputs.linux }}
      run-macos: ${{ steps.platforms.outputs.macos }}
      run-windows: ${{ steps.platforms.outputs.windows }}
      run-windows-portable: ${{ steps.platforms.outputs.windows-portable }}
      run-macos-desktop: ${{ steps.platforms.outputs.macos-desktop }}
      run-windows-desktop: ${{ steps.platforms.outputs.windows-desktop }}
      # Whether a cpu workflow list is defined (gates all CPU/desktop jobs)
      has-cpu: ${{ steps.platforms.outputs.has-cpu }}
      # Publish
      run-publish: ${{ steps.platforms.outputs.publish }}
    steps:
      - name: Resolve target repo/branch
        env:
          INPUT_REPO: ${{ inputs.node_repo }}
          INPUT_BRANCH: ${{ inputs.node_branch }}
        run: |
          TARGET_REPO="${INPUT_REPO:-${{ github.repository }}}"
          TARGET_BRANCH="${INPUT_BRANCH:-${{ github.ref_name }}}"
          TARGET_SHA="${{ github.sha }}"
          if [ -n "$INPUT_REPO" ] || [ -n "$INPUT_BRANCH" ]; then
            # Resolve sha from the target repo+branch via the GitHub API
            RESOLVED=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.NODE_PAT || secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$TARGET_REPO/branches/$TARGET_BRANCH" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',{}).get('sha',''))" 2>/dev/null || echo "")
            if [ -n "$RESOLVED" ]; then TARGET_SHA="$RESOLVED"; fi
          fi
          echo "TARGET_REPO=$TARGET_REPO" >> $GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "TARGET_SHA=$TARGET_SHA" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.NODE_PAT || github.token }}

      - name: Parse platform config
        id: platforms
        env:
          CONFIG: ${{ inputs.config-file }}
          FILTER: ${{ inputs.lane || inputs.platform }}
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          cfg = os.environ["CONFIG"]
          try:
              with open(cfg, "rb") as f:
                  data = tomllib.load(f)
          except Exception as e:
              print(f"::error::cannot read {cfg}: {e}"); sys.exit(1)
          test = data.get("test", {})
          allow = (test.get("lanes") or {}).get("lanes")
          if not isinstance(allow, list):
              if "platforms" in test:
                  print('::error::[test.platforms] was renamed to [test.lanes]: lanes = ["linux-cpu", ...]')
              else:
                  print('::error::[test.lanes] must be an allowlist: lanes = ["linux-cpu", ...]')
              sys.exit(1)
          # `platform` input filters to one target; otherwise use the allowlist.
          # Tokens accepted in hyphen or underscore spelling (matches the registry).
          filt = os.environ.get("FILTER", "").strip()
          if filt:
              sel = {filt, filt.replace("-", "_"), filt.replace("_", "-")}
          else:
              sel = set()
              for t in allow:
                  t = str(t); sel |= {t, t.replace("-", "_"), t.replace("_", "-")}
          def on(*toks):
              return "true" if sel & set(toks) else "false"
          # The 6 GitHub-hosted platforms (== registry.matrix()['hosted'];
          # kept in sync by tests/test_lanes_matrix_yaml.py).
          rows = {
              "linux": on("linux-cpu", "linux"),
              "macos": on("macos-cpu", "macos"),
              "windows": on("windows-cpu", "windows"),
              "windows-portable": on("windows-portable-cpu", "windows_portable", "windows-portable"),
              "macos-desktop": on("macos-desktop", "macos_desktop"),
              "windows-desktop": on("windows-desktop", "windows_desktop"),
              "has-cpu": "true" if "cpu" in test.get("workflows", {}) else "false",
              "publish": "false" if test.get("publish") is False else "true",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in rows.items():
                  f.write(f"{k}={v}\n")
          print("resolved platforms:", rows)
          PY

  # ---------------------------------------------------------------------------
  # CPU tests (GitHub-hosted runners) - only if a cpu workflow list is defined
  # ---------------------------------------------------------------------------
  linux-cpu:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-linux == 'true'
    uses: ./.github/workflows/_test-linux.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  macos-cpu:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-macos == 'true'
    uses: ./.github/workflows/_test-macos.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  windows-cpu:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-windows == 'true'
    uses: ./.github/workflows/_test-windows.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  windows-portable-cpu:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-windows-portable == 'true'
    uses: ./.github/workflows/_test-windows-portable.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Desktop (Electron) tests on GitHub-hosted runners
  # ---------------------------------------------------------------------------
  macos-desktop:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-macos-desktop == 'true'
    uses: ./.github/workflows/_test-macos-desktop.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  windows-desktop:
    needs: [setup]
    if: needs.setup.outputs.has-cpu == 'true' && needs.setup.outputs.run-windows-desktop == 'true'
    uses: ./.github/workflows/_test-windows-desktop.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit

  # Accelerator (cuda) targets run via dispatch-test.yml on self-hosted runners,
  # not here. This matrix is the GitHub-hosted cpu + desktop lanes only.

  # ---------------------------------------------------------------------------
  # Publish results
  # ---------------------------------------------------------------------------
  publish:
    needs: [setup, linux-cpu, macos-cpu, windows-cpu, windows-portable-cpu, macos-desktop, windows-desktop]
    if: always() && needs.setup.outputs.run-publish == 'true'
    uses: ./.github/workflows/_publish-results.yml
    with:
      node_repo: ${{ inputs.node_repo }}
      node_branch: ${{ inputs.node_branch }}
    secrets: inherit
